name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          XC=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          echo "Using $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Install MAUI workload
        run: dotnet workload install maui-ios

      - name: Build (no code signing)
        run: |
          dotnet build App/BrazilOmu.csproj -f net10.0-ios -c Release -p:RuntimeIdentifier=ios-arm64 -p:ValidateXcodeVersion=false -p:EnableCodeSigning=false -p:CodesignRequireProvisioningProfile=false -p:EnableAssemblyILStripping=false -p:MtouchLink=None -p:PublishTrimmed=false -v:minimal

      - name: Package IPA
        run: |
          APP=$(find App/bin/Release -name "*.app" -type d | head -n 1)
          echo "Found app: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr BrazilOmu.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: BrazilOmu-ipa
          path: BrazilOmu.ipa
