name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || true

      - name: Install MAUI workload
        run: dotnet workload install maui-ios

      - name: Build (no code signing)
        run: |
          dotnet build BrazilOmu/App/BrazilOmu.csproj \
            -f net8.0-ios -c Release \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:EnableCodeSigning=false \
            -p:CodesignRequireProvisioningProfile=false \
            -p:EnableAssemblyILStripping=false

      - name: Package IPA
        run: |
          APP=$(find BrazilOmu/App/bin/Release -name "*.app" -type d | head -n 1)
          echo "Found app: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr BrazilOmu.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: BrazilOmu-ipa
          path: BrazilOmu.ipa
